name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Playwright smoke test
        run: |
          npx playwright install --with-deps chromium webkit
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results

  # Accounts + sync: security rules and two-device sync against a throwaway local Supabase.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - name: Security and sync tests
        run: ./scripts/test-db.sh
      - name: Two-device browser test
        run: |
          npx playwright install --with-deps chromium
          ./scripts/test-sync-e2e.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sync-test-results
          path: test-results
