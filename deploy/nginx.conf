server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The CSP is also in index.html; the header version adds frame-ancestors, which a meta tag can't.
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Hashed assets never change.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
  }

  # The service worker and the page itself must always be revalidated, or updates never arrive.
  location ~* ^/(sw\.js|registerSW\.js|index\.html|manifest\.webmanifest)$ {
    # add_header in a location replaces the server-level ones, so repeat them here.
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
}
